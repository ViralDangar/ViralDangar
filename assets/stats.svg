<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter><style>
text { font-family: 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif; }
.idx { font-size: 15px; letter-spacing: 4.5px; fill: #666666; text-transform: uppercase; }
/* No entrance animations: GitHub's mobile app, link previews and some
   renderers show only the first frame of an SVG, so every element must be
   fully drawn at t=0. The only motion is the availability dot, which is
   visible at every point of its cycle. */
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style></defs>
<rect width="1200" height="210" fill="#F6F5F4"/>
<rect x="56" y="28" width="1088" height="154" fill="none" stroke="rgba(20,20,20,0.15)"/>
<text x="86.0" y="118" font-size="64" font-weight="900" letter-spacing="-2" fill="#141414" class="fade" style="animation-delay:0.1s">3<tspan fill="#FF4D00">+</tspan></text>
<text x="86.0" y="154" font-size="12" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="2.4" >YEARS EXPERIENCE</text>
<line x1="328.0" y1="28" x2="328.0" y2="182" stroke="rgba(20,20,20,0.15)"/>
<text x="358.0" y="118" font-size="64" font-weight="900" letter-spacing="-2" fill="#141414" class="fade" style="animation-delay:0.2s">10<tspan fill="#FF4D00">+</tspan></text>
<text x="358.0" y="154" font-size="12" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="2.4" >PROJECTS DELIVERED</text>
<line x1="600.0" y1="28" x2="600.0" y2="182" stroke="rgba(20,20,20,0.15)"/>
<text x="630.0" y="118" font-size="64" font-weight="900" letter-spacing="-2" fill="#141414" class="fade" style="animation-delay:0.3s">90%<tspan fill="#FF4D00">+</tspan></text>
<text x="630.0" y="154" font-size="12" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="2.4" >MANUAL EFFORT REMOVED</text>
<line x1="872.0" y1="28" x2="872.0" y2="182" stroke="rgba(20,20,20,0.15)"/>
<text x="902.0" y="118" font-size="64" font-weight="900" letter-spacing="-2" fill="#141414" class="fade" style="animation-delay:0.4s">100K<tspan fill="#FF4D00">+</tspan></text>
<text x="902.0" y="154" font-size="12" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="2.4" >RECORDS RECONCILED / DAY</text>
<rect width="1200" height="210" filter="url(#grain)" opacity="0.06"/>
</svg>
