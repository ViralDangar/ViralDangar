<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter><style>
text { font-family: 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif; }
.idx { font-size: 15px; letter-spacing: 4.5px; fill: #666666; text-transform: uppercase; }
/* No entrance animations: GitHub's mobile app, link previews and some
   renderers show only the first frame of an SVG, so every element must be
   fully drawn at t=0. The only motion is the availability dot, which is
   visible at every point of its cycle. */
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.rise{--d:130px}</style></defs>
<rect width="1200" height="400" fill="#F6F5F4"/>

<line x1="56" y1="34" x2="1144" y2="34" stroke="rgba(20,20,20,0.15)"/>
<text x="56" y="74" font-size="15" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="4.5" >05 — CONTACT</text>
<clipPath id="a"><rect x="0" y="86" width="1200" height="122"/></clipPath>
<clipPath id="b"><rect x="0" y="208" width="1200" height="122"/></clipPath>
<g clip-path="url(#a)"><text x="51" y="196" font-size="128" font-weight="900" fill="#141414" text-anchor="start" letter-spacing="-4" class="rise" style="animation-delay:.1s">LET&#x27;S WORK</text></g>
<g clip-path="url(#b)"><text x="51" y="318" font-size="128" font-weight="900" fill="#FF4D00" text-anchor="start" letter-spacing="-4" class="rise" style="animation-delay:.25s">TOGETHER</text></g>
<text x="1144" y="300" font-size="21" font-weight="400" fill="#666666" text-anchor="end" >Hiring, or building something</text>
<text x="1144" y="330" font-size="21" font-weight="400" fill="#666666" text-anchor="end" >that has to be exactly right?</text>
<line x1="56" y1="370" x2="1144" y2="370" stroke="rgba(20,20,20,0.15)"/>

<rect width="1200" height="400" filter="url(#grain)" opacity="0.06"/>
</svg>
